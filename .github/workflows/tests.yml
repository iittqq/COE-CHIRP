# Runs the depth-processing tests of all three implementations (web, mobile,
# notebook) against the shared fixtures in test-fixtures/bathymetry/.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    name: Fixtures are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python test-fixtures/bathymetry/generate.py
      - run: git diff --exit-code test-fixtures/

  web:
    name: Web app (type-check, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chirp-control-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chirp-control-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app (analyze, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chirp_control
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

  notebook:
    name: Notebook module (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_visualization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data_visualization/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: CF-1.8 compliance of the NetCDF golden file
        run: |
          pip install compliance-checker
          compliance-checker --test cf:1.8 --criteria strict --format text \
            ../test-fixtures/netcdf/header.nc | tee cf-report.txt
          grep -q "All tests passed" cf-report.txt
